[package]
name = "stacksafe-macro"
version = "0.1.4"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/fast/stacksafe"
description = "Compatibility backport of the stacksafe procedural macro"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing"] }

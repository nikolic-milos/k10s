[package]
name = "k10s-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "k10s"
path = "src/main.rs"

[dependencies]
k10s-core.workspace = true
k10s-clustergen.workspace = true
k10s-data.workspace = true
k10s-world.workspace = true
k10s-map.workspace = true
gpui.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true }

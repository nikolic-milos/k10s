[package]
name = "k10s-atlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Generic 2D semantic-zoom map engine: camera, LOD policy, hierarchical culling over a flat scene, frame stats, and a scripted flight bench harness."

[lints]
workspace = true

[features]
# Gates `src/testing.rs` -- the synthetic scenes and the bench LOD policy -- and
# with it both benches, which require it. Off by default so a shipping build
# links neither the fixtures nor the strings they allocate.
testing = []

[dependencies]
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
k10s-bench.workspace = true

[[bench]]
name = "cull"
harness = false
required-features = ["testing"]

[[bench]]
name = "fanout"
harness = false
required-features = ["testing"]

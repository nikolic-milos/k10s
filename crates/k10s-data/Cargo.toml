[package]
name = "k10s-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
k10s-core.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
# Helm's release Secrets: base64 of gzip of JSON, both layers its own client's.
base64.workspace = true
flate2.workspace = true
# The client is assembled in connect.rs from kube's own public layers, because
# kube builds its connector behind a private function with TCP_NODELAY off and
# that one socket option was measured at 44 ms of every cold start. All five
# are already in the lock through kube-client.
hyper-util.workspace = true
hyper-timeout.workspace = true
tower.workspace = true
tower-http.workspace = true
http-body-util.workspace = true

[dev-dependencies]
k10s-world.workspace = true
# Test-only, and the reason is the live matrix: proving the write path end to end
# means building the payload with the same prune the shell uses, and that prune
# lives in the editor engine. The shipped data plane still knows nothing about
# the editor.
k10s-edit.workspace = true


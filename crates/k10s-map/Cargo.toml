[package]
name = "k10s-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `testing` compiles the headless walk harness the bench and the app's flight
# recorder drive: cargo bench -p k10s-map --bench walk --features testing.
# `bench-alloc` adds the counting allocator that ratchets label allocations to
# zero: ... --features testing,bench-alloc. Neither is on for a shipping build.
testing = []
bench-alloc = []

[dependencies]
k10s-atlas.workspace = true
k10s-core.workspace = true
k10s-theme.workspace = true
gpui.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
k10s-bench.workspace = true
k10s-atlas = { workspace = true, features = ["testing"] }
stats_alloc = "0.1.10"

[[bench]]
name = "walk"
harness = false
required-features = ["testing"]

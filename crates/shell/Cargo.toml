[package]
name = "k10s-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The fake filesystem, for tests in this crate and for the benchmarks that
# measure the file tree and the pickers without a disk. Zed's own `fs` crate
# gates its fake the same way.
test-support = []

[dependencies]
k10s-atlas.workspace = true
k10s-core.workspace = true
k10s-edit.workspace = true
k10s-map.workspace = true
k10s-theme.workspace = true
gpui.workspace = true
serde_json.workspace = true
futures.workspace = true
regex.workspace = true
alacritty_terminal.workspace = true
rustix.workspace = true

[dev-dependencies]
k10s-bench.workspace = true
k10s-world.workspace = true

[[bench]]
name = "shell"
harness = false
required-features = ["test-support"]

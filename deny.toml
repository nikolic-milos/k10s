[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is build-time-only through image/exr/pulp; upstream has no safe upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pinned by GPUI/fontdb/usvg; track until GPUI moves to skrifa" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is pinned by GPUI/usvg; track until GPUI completes the harfrust migration" },
]

[licenses]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
ignore = false

[[licenses.clarify]]
crate = "gpui_shared_string"
expression = "Apache-2.0"
license-files = [
    { path = "../../LICENSE-APACHE", hash = 0x076d9a33 },
]

[[licenses.clarify]]
crate = "gpui_util"
expression = "Apache-2.0"
license-files = [
    { path = "../../LICENSE-APACHE", hash = 0x076d9a33 },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
    { crate = "proc-macro-error-attr2", reason = "obsolete proc-macro-error2 support crate" },
    { crate = "proc-macro-error2", reason = "Rust future-incompatibility E0365" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/nikolic-milos/zed",
    "https://github.com/proptest-rs/proptest",
    "https://github.com/rust-x-bindings/rust-xcb",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/xim-rs",
]

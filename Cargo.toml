[workspace]
resolver = "3"
members = [
    "crates/k10s-atlas",
    "crates/k10s-core",
    "crates/k10s-clustergen",
    "crates/k10s-world",
    "crates/k10s-map",
    "crates/k10s-app",
    "crates/k10s-data",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Miloš Nikolić <milosnikolic@milosnikolic.de>"]
repository = "https://github.com/nikolic-milos/k10s"

[workspace.dependencies]
k10s-atlas = { path = "crates/k10s-atlas" }
k10s-core = { path = "crates/k10s-core" }
k10s-clustergen = { path = "crates/k10s-clustergen" }
k10s-world = { path = "crates/k10s-world" }
k10s-map = { path = "crates/k10s-map" }
k10s-app = { path = "crates/k10s-app" }
k10s-data = { path = "crates/k10s-data" }

gpui = { git = "https://github.com/nikolic-milos/zed", rev = "1997311daedbd90333b6710634d2cfbd81b33306" }
gpui_platform = { git = "https://github.com/nikolic-milos/zed", rev = "1997311daedbd90333b6710634d2cfbd81b33306" }

bevy_ecs = "0.19"
arc-swap = "1.9"
crossbeam-channel = "0.5"
futures = "0.3"
rand = "0.10"
rand_chacha = "0.10"
serde = "1"
serde_json = "1"

kube = { version = "4.0", features = ["runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
too_many_arguments = "allow"
dbg_macro = "deny"
todo = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true

[profile.bench]
inherits = "release"

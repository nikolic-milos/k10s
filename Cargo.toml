[workspace]
resolver = "3"
members = [
    "crates/k10s-atlas",
    "crates/k10s-core",
    "crates/k10s-clustergen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Miloš Nikolić <milosnikolic@milosnikolic.de>"]
repository = "https://github.com/nikolic-milos/k10s"

[workspace.dependencies]
k10s-atlas = { path = "crates/k10s-atlas" }
k10s-core = { path = "crates/k10s-core" }
k10s-clustergen = { path = "crates/k10s-clustergen" }

arc-swap = "1.9"
crossbeam-channel = "0.5"
rand = "0.10"
rand_chacha = "0.10"
serde = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true
lto = "thin"
